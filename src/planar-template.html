<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>带电粒子 · 组合场教学沙盒</title><style id="math-style">/* MATH_STYLE */</style><style>/* INLINE_STYLE */</style></head><body>
<header><div class="brand"><span class="brand-icon">⊗</span><strong>带电粒子</strong><span>平面物理沙盒</span></div><div class="header-group"><button id="examples-button">典型场景 ▾</button><button data-panel="teaching" class="lesson-entry">专题强化6</button><button id="blank">空白画布</button><button id="undo" title="撤销">↶ 撤销</button><button id="redo" title="重做">↷</button></div><div class="header-right"><button id="save" title="保存当前场景 · Ctrl+S">保存</button><button id="present">投屏</button><details id="workspace-actions"><summary aria-label="更多沙盒操作">更多 <span>⌄</span></summary><div><button id="load">载入场景文件</button><button id="export">导出当前题图</button><button id="fullscreen">进入全屏</button><button id="help">操作说明与快捷键</button></div></details></div></header>
<main><section id="stage"><svg id="paper" xmlns="http://www.w3.org/2000/svg" tabindex="0" role="img" aria-label="平面带电粒子物理沙盒，点击放置或拖动对象"></svg>
 <div id="tool-rail" class="tool-rail"><button data-tool="select" class="active"><span>↖</span>选择</button><button data-tool="pan"><span>✥</span>平移</button><hr><button data-tool="particle"><span>●</span>粒子</button><button id="source-menu"><span>⌁</span>粒子源</button><button id="electric-menu"><span>⇢</span>电场</button><button id="field-menu"><span>⊗</span>磁场</button><button id="field-probe-button" data-tool="field-probe" aria-label="场强探针" aria-pressed="false"><span>⌖</span>场强探针</button><hr><button id="measure-menu"><span>∠</span>构造</button><button id="geometry-button"><span>◌</span>几何</button><button data-panel="relations"><span>ƒ</span>依赖</button></div><button id="tools-more" aria-label="滚动查看更多工具">⌄</button>
 <div id="palette" class="popover" hidden></div><div id="examples" class="popover examples" hidden></div>
 <div id="selection-actions" hidden role="toolbar" aria-label="选中对象快捷操作"><span id="selection-action-label"></span><button data-quick="properties">参数</button><button data-quick="duplicate">复制</button><button data-quick="delete" class="danger">删除</button></div><div id="canvas-heading"><span id="tool-hint">选择对象，或从左侧添加组件</span><span id="selection-info"></span></div>
 <div class="snap-bar"><button data-snap-toggle="grid" title="网格吸附">▦ 网格 <span id="snap-grid-size"></span></button><button data-snap-toggle="geometry" title="几何点、路径与交点吸附">⌖ 捕捉</button><button data-snap-toggle="lock" title="捕获后建立持续依赖">◇ 锁定</button><button data-panel="relations" aria-label="捕捉与依赖设置">⋯</button></div>
 <div id="dependency-notice" role="status" hidden></div>
 <div class="view-controls"><button id="pan-left" aria-label="画面左移">←</button><button id="pan-up" aria-label="画面上移">↑</button><button id="pan-down" aria-label="画面下移">↓</button><button id="pan-right" aria-label="画面右移">→</button><span></span><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适配</button><button id="inspector-toggle">参数 ›</button></div>

 <div id="teaching-hud" hidden></div><div class="canvas-status"><span>合场：⊙ 纸外 · × 纸内 · 强场更密</span><span id="scale-note"></span></div>
</section><aside id="inspector"><div class="inspector-tabs"><button data-panel="teaching">教学</button><button data-panel="objects" class="active">参数</button><button data-panel="relations">依赖</button><button data-panel="geometry">辅助</button><button data-panel="display">显示</button></div><div id="panel-content"></div></aside></main>
<footer id="simulation-timeline" class="simulation-timeline"><div class="timeline-height-resizer" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="调整时间轴高度；双击恢复默认"></div>
 <div class="timeline-toolbar"><div class="play-actions"><button id="reset-time" title="回到初态" aria-label="回到初态">↺</button><button id="play" class="primary">播放</button><button id="step">单步</button><button id="next-event">下一事件</button></div><label class="timeline-duration">时长 <input id="duration" type="number" min=".000001" step="any" aria-label="仿真观察时长"> <span>μs</span></label><label>倍率 <select id="rate" aria-label="播放倍率"><option value=".125">0.125×</option><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label><div class="track-controls"><label for="track-mode">轨迹</label><select id="track-mode" aria-label="轨迹显示模式"><option value="full">全程</option><option value="trail">拖尾</option><option value="both">全程＋拖尾</option><option value="none">隐藏</option></select></div><details id="timeline-trail-options"><summary>拖尾设置</summary><div><label><input id="trail-auto" type="checkbox" checked>自动选择时长</label><label class="timeline-trail-time">τ <input id="trail-duration" type="number" min=".000001" step="any" aria-label="拖尾时长"> μs</label><input id="trail-duration-slider" type="range" min=".000001" max="1" step="any" aria-label="连续调节拖尾时长"><input id="trail-enabled" type="checkbox" hidden><div id="trail-readout"></div><p>按物理时间截取拖尾，不改变粒子运动。</p></div></details><button type="button" data-timeline-action="toggle" aria-expanded="true">轨道 ▾</button></div>
 <div class="timeline-position"><span id="time-readout"></span><input id="timeline" type="range" min="0" max="1000" value="0" step="1" aria-label="仿真时刻"><label>定位 <input id="timeline-seek-us" type="number" min="0" step="any" aria-label="定位到微秒时刻"> μs</label></div>
 <div class="timeline-workspace"><div class="timeline-track-tools"><label>轨道 <select id="timeline-track-filter" aria-label="筛选粒子轨道"><option value="all">全部轨道</option></select></label><button type="button" id="timeline-current-trace" data-timeline-action="current-trace" aria-label="在时间轴显示当前选中的粒子">当前粒子</button><label>事件 <select id="timeline-event-filter" aria-label="筛选关键事件"><option value="all">全部</option><option value="boundary">进出场域</option><option value="vx-zero">vx=0 · 横向</option><option value="vy-zero">vy=0 · 纵向</option><option value="switch">换向</option><option value="birth">发射</option></select></label><div class="timeline-view-tools"><button type="button" data-timeline-action="zoom-out" aria-label="时间轴缩小">−</button><button type="button" data-timeline-action="zoom-in" aria-label="时间轴放大">＋</button><button type="button" data-timeline-action="fit">全程</button></div><span class="timeline-range-label"></span><button type="button" data-timeline-action="close-event" hidden aria-label="关闭事件读数">×</button></div><div class="timeline-lanes" tabindex="0" aria-label="多轨仿真时间轴"><div class="timeline-ruler"></div><div class="timeline-rows"></div><div class="timeline-cursor" aria-hidden="true"></div></div><div class="timeline-limitations" role="status" hidden></div><div class="timeline-event-detail" hidden></div></div>
</footer>
<input id="file-input" type="file" accept=".json,application/json" hidden><div id="toast" role="status"></div><dialog id="help-dialog"><button id="help-close" class="close-dialog">×</button><div id="help-content"></div></dialog>
<script>/* INLINE_APP */</script><!-- LIBRARY_LICENSES --></body></html>
