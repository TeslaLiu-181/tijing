<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>物理补充探究 · 题景</title><style>/* MATH_STYLE */</style><style>/* STYLE */</style></head><body>
<header><span class="brand">题景 / 补充探究</span><strong id="heading">物理交互模型</strong></header>
<main><section id="stage" aria-label="三维物理演示"><div id="labels" aria-hidden="true"></div><div class="view-bar" role="group" aria-label="视角"><button data-view="front">正视</button><button data-view="spatial">立体</button><button data-view="top">俯视</button><button id="fit">适合窗口</button><button id="panel-toggle" aria-label="显示或收起参数">参数</button></div><div class="display-options"><label><input id="forces" type="checkbox" checked>受力</label><label><input id="field" type="checkbox" checked>磁场</label></div><p id="scene-status" aria-live="polite"></p><p class="canvas-hint">拖动旋转 · 滚轮缩放</p><div id="failure" role="alert" hidden></div></section>
<aside id="panel"><div class="panel-section"><label class="eyebrow" for="variant">观察状态</label><select id="variant"></select></div><details id="parameter-detail" class="panel-section" open><summary>参数探究</summary><div id="parameters"></div></details><section class="panel-section"><h2>当前读数</h2><div id="metrics" class="metric-grid"></div><div id="warnings" role="status"></div></section><div class="panel-section" id="chart-wrap"><svg id="chart" viewBox="0 0 280 165" role="img" aria-label="物理量变化曲线"></svg><div id="chart-label"></div></div><details id="explanation" class="panel-section" open><summary>观察与推导</summary><div id="formula"></div><ol id="guide"></ol><p id="notice"></p></details></aside></main>
<footer><button id="play" class="primary" aria-label="播放">▶ 播放</button><button id="reset" aria-label="重置模型">↺ 重置</button><label class="progress-wrap"><span id="progress-caption">过程</span><input id="progress" type="range" min="0" max="1" step="0.001" value="0" aria-label="过程进度"></label><output id="time">0%</output><label class="speed-wrap">演示速度<select id="speed" aria-label="演示速度"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></footer>
<script>/* APP */</script></body></html>
