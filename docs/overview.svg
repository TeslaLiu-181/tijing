<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">题景 v0.7.0 — 物理教学全栈项目概览</title>
  <desc id="desc">教师从资源导入校对到场景构造、原生计算、保存，再发布班组快照或离线导出。原生 JavaScript 宿主以 iframe 和 bridge 连接物理编辑器，Node.js 24 HTTP 服务使用 SQLite 和持久附件。AI 辅助自动建模仅支持原生平面场景；微信默认关闭。代码 MIT，教学材料遵循单独授权说明。</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#dfe8d9" stroke-width=".7"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#699f85" stroke-width="1.3"/></marker>
    <style>text{font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:Consolas,"SFMono-Regular",monospace}.ink{fill:#183a36}.muted{fill:#536d67}.teal{fill:#086f61}.small{font-size:14px}.caption{font-size:12px}</style>
  </defs>
  <rect width="1280" height="780" rx="24" fill="#f6f8f2"/>
