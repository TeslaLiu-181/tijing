  <text x="54" y="152" class="ink" font-size="38" font-weight="750" letter-spacing="-1">把一道题，变成可探索的物理现场。</text>
  <text x="56" y="188" class="muted" font-size="17">题目资源 · 原生物理沙盒 · 师生教学空间 · AI 辅助建模</text>
  <g transform="translate(1000 42)"><circle cx="81" cy="72" r="62" fill="none" stroke="#bdd7c4"/><ellipse cx="81" cy="72" rx="104" ry="29" transform="rotate(-33 81 72)" fill="none" stroke="#538f74" stroke-width="1.5"/><circle cx="81" cy="72" r="11" fill="#0c7461"/><circle cx="157" cy="27" r="6" fill="#c18e49"/><path d="M25 133H150" stroke="#bdd1c0"/><text x="34" y="157" class="muted mono" font-size="13">observe · explore</text></g>

