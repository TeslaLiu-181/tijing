    <rect width="1172" height="96" rx="17" fill="#e6f0e2" stroke="#d1e0cf"/>
    <text x="22" y="25" class="teal" font-size="11" font-weight="700" letter-spacing="1.6">TEACHING WORKFLOW</text>
    <g class="ink" font-size="16" font-weight="650"><text x="22" y="64">资源导入与校对</text><text x="274" y="64">场景构造</text><text x="497" y="64">原生计算</text><text x="723" y="64">保存场景</text><text x="939" y="64">班组发布 / 离线导出</text></g>
